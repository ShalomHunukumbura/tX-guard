[package]
name = "tx-guard"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Find emails, background jobs and API calls that run before the database transaction commits."
license = "MIT"
repository = "https://github.com/ShalomHunukumbura/tx-guard"
readme = "README.md"
keywords = ["transaction", "linter", "django", "celery", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.27"
tree-sitter-python = "0.25"

[profile.release]
lto = true
codegen-units = 1
strip = true
